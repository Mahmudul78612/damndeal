<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Partner Login — DamnDeal</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <h1>Damn<span style="color:#F59E0B">Deal</span></h1>
      <p class="sub">Partner Portal — Login with OTP</p>
      <div class="login-error" id="err"></div>

      <!-- Step 1: Phone -->
      <div id="step1">
        <div class="form-group">
          <label>Phone Number</label>
          <div style="display:flex;align-items:center;gap:0">
            <span style="padding:8px 10px;background:#f0f0f0;border:1px solid #ddd;border-right:none;border-radius:8px 0 0 8px;font-size:14px;color:#333">+91</span>
            <input class="form-control" id="phone" type="tel" placeholder="9876543210" maxlength="10" style="border-radius:0 8px 8px 0">
          </div>
        </div>
        <button class="btn btn-primary" id="btnSend" onclick="sendOtp()">Send OTP</button>
      </div>

      <!-- Step 2: OTP -->
      <div id="step2" style="display:none">
        <div class="form-group">
          <label>Enter OTP</label>
          <input class="form-control" id="otp" type="text" placeholder="6-digit OTP" maxlength="6">
        </div>
        <button class="btn btn-primary" id="btnVerify" onclick="verifyOtp()">Verify & Login</button>
        <p class="text-sm text-muted mt-1" style="cursor:pointer" onclick="backToPhone()">← Change number</p>
      </div>

      <!-- Step 3: Complete Profile -->
      <div id="step3" style="display:none">
        <p class="text-sm text-muted mb-2">Complete your profile to continue</p>
        <div class="form-group">
          <label>Full Name</label>
          <input class="form-control" id="pName" placeholder="Your name">
        </div>
        <div class="form-group">
          <label>Email</label>
          <input class="form-control" id="pEmail" type="email" placeholder="email@example.com">
        </div>
        <button class="btn btn-primary" onclick="completeProfile()">Save & Continue</button>
      </div>
    </div>
  </div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script>
    // Auto-redirect if logged in
    (function(){
      const t = getToken(), u = getUser();
      if (t && u && u.role === 'partner') window.location.href = 'pages/dashboard/dashboard.html';
    })();

    const errEl = document.getElementById('err');
    function showErr(msg) { errEl.textContent = msg; errEl.style.display = 'block'; }
    function hideErr() { errEl.style.display = 'none'; }

    let savedPhone = '';

    async function sendOtp() {
      hideErr();
      let phone = document.getElementById('phone').value.trim();
      if (!phone) { showErr('Enter phone number'); return; }
      if (!phone.startsWith('+')) phone = '+91' + phone.replace(/^0+/,'');
      savedPhone = phone;

      const btn = document.getElementById('btnSend');
      btn.disabled = true; btn.textContent = 'Sending...';
      try {
        await API.post('/auth/send-otp', { phone });
        document.getElementById('step1').style.display = 'none';
        document.getElementById('step2').style.display = 'block';
        document.getElementById('otp').focus();
      } catch (e) { showErr(e.message); }
      btn.disabled = false; btn.textContent = 'Send OTP';
    }

    async function verifyOtp() {
      hideErr();
      const otp = document.getElementById('otp').value.trim();
      if (!otp || otp.length < 4) { showErr('Enter valid OTP'); return; }

      const btn = document.getElementById('btnVerify');
      btn.disabled = true; btn.textContent = 'Verifying...';
      try {
        const data = await API.post('/auth/verify-otp', { phone: savedPhone, otp });
        if (data.user && data.user.role !== 'partner') {
          showErr('This number is not registered as a partner.');
          btn.disabled = false; btn.textContent = 'Verify & Login';
          return;
        }
        setAuth(data);

        if (data.isNewUser || !data.isProfileComplete) {
          document.getElementById('step2').style.display = 'none';
          document.getElementById('step3').style.display = 'block';
        } else {
          window.location.href = 'pages/dashboard/dashboard.html';
        }
      } catch (e) { showErr(e.message); }
      btn.disabled = false; btn.textContent = 'Verify & Login';
    }

    async function completeProfile() {
      hideErr();
      const name = document.getElementById('pName').value.trim();
      const email = document.getElementById('pEmail').value.trim();
      if (!name) { showErr('Name is required'); return; }
      try {
        const data = await API.put('/auth/complete-profile', { name, email });
        if (data.user) setAuth(data);
        window.location.href = 'pages/dashboard/dashboard.html';
      } catch (e) { showErr(e.message); }
    }

    function backToPhone() {
      hideErr();
      document.getElementById('step2').style.display = 'none';
      document.getElementById('step1').style.display = 'block';
    }

    // Enter key
    document.getElementById('phone').addEventListener('keyup', e => { if(e.key==='Enter') sendOtp(); });
    document.getElementById('otp').addEventListener('keyup', e => { if(e.key==='Enter') verifyOtp(); });
  </script>
</body>
</html>
