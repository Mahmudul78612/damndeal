server {
    listen 80;
    server_name damndeal.in www.damndeal.in 168.144.20.237;
    return 301 https://damndeal.in$request_uri;
}

server {
    listen 443 ssl;
    server_name www.damndeal.in;
    ssl_certificate /etc/letsencrypt/live/damndeal.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/damndeal.in/privkey.pem;
    return 301 https://damndeal.in$request_uri;
}

server {
    listen 443 ssl;
    server_name damndeal.in;

    ssl_certificate /etc/letsencrypt/live/damndeal.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/damndeal.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 10M;

    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:5000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }

    location /uploads/ {
        alias /var/www/damndeal/uploads/;
        expires 30d;
        add_header Cache-Control public;
        access_log off;
    }

    location /admin/ {
        alias /var/www/damndeal/admin/;
        try_files $uri $uri/ /admin/index.html;
    }

    location /partner/ {
        alias /var/www/damndeal/partnerportal/;
        try_files $uri $uri/ /partner/index.html;
    }

    location /_next/static/ {
        alias /var/www/damndeal/web/.next/static/;
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
